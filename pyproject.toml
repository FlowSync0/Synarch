[tool.pytest.ini_options]
pythonpath = [
  "shared/models",
  "packages/gateway",
  "packages/control-plane",
  "packages/state-service",
  "packages/memory-service",
  "packages/event-service",
  "packages/agent-runtime"
]
testpaths = ["shared/models/tests", "packages"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "shared/models",
  "packages/gateway",
  "packages/control-plane",
  "packages/state-service",
  "packages/memory-service",
  "packages/event-service",
  "packages/agent-runtime"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
