name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e shared/models
          python -m pip install -e packages/gateway
          python -m pip install -e packages/control-plane
          python -m pip install -e packages/state-service
          python -m pip install -e packages/memory-service
          python -m pip install -e packages/event-service
          python -m pip install -e packages/model-gateway
          python -m pip install -e packages/agent-runtime
          python -m pip install pytest ruff mypy
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy shared/models packages/gateway packages/control-plane packages/state-service packages/memory-service packages/event-service packages/model-gateway packages/agent-runtime --cache-dir /tmp/synarch-mypy-cache
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck frontend
        run: npm run typecheck
