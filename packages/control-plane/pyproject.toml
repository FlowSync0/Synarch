[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synarch-control-plane"
version = "0.1.0"
description = "Control plane for Synarch agents, permissions, and policies."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
  "synarch-models"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synarch_control_plane*"]
