[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synarch-agent-runtime"
version = "0.1.0"
description = "Agent runtime for Synarch persistent division agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
  "synarch-models"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synarch_agent_runtime*"]
