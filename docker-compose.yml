services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synarch
      POSTGRES_USER: synarch
      POSTGRES_PASSWORD: synarch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synarch -d synarch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  gateway:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/gateway
    environment:
      APP_MODULE: synarch_gateway.main:app
      CONTROL_PLANE_URL: http://control-plane:8010
      STATE_SERVICE_URL: http://state-service:8020
      MEMORY_SERVICE_URL: http://memory-service:8030
      EVENT_SERVICE_URL: http://event-service:8040
      AGENT_RUNTIME_URL: http://agent-runtime:8050
      AGENT_RUNTIME_TIMEOUT_SECONDS: ${AGENT_RUNTIME_TIMEOUT_SECONDS:-180}
      TASK_RUNNER_PROVIDER_ID: ${TASK_RUNNER_PROVIDER_ID:-provider-local-runtime-stub}
      TASK_RUNNER_MODEL_ID: ${TASK_RUNNER_MODEL_ID:-model-local-runtime-stub}
      TASK_RUNNER_INPUT_COST_PER_MILLION_TOKENS: ${TASK_RUNNER_INPUT_COST_PER_MILLION_TOKENS:-0}
      TASK_RUNNER_OUTPUT_COST_PER_MILLION_TOKENS: ${TASK_RUNNER_OUTPUT_COST_PER_MILLION_TOKENS:-0}
      TASK_RUNNER_EMBEDDING_PROVIDER_ID: ${TASK_RUNNER_EMBEDDING_PROVIDER_ID:-}
      TASK_RUNNER_EMBEDDING_MODEL_ID: ${TASK_RUNNER_EMBEDDING_MODEL_ID:-}
      TASK_RUNNER_EMBEDDING_TIMEOUT_SECONDS: ${TASK_RUNNER_EMBEDDING_TIMEOUT_SECONDS:-20}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WEB_EXTRACT_DEFAULT_PROVIDER: ${WEB_EXTRACT_DEFAULT_PROVIDER:-local_fetch}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      FIRECRAWL_TIMEOUT_SECONDS: ${FIRECRAWL_TIMEOUT_SECONDS:-30}
      BROWSERLESS_BASE_URL: ${BROWSERLESS_BASE_URL:-https://production-sfo.browserless.io}
      BROWSERLESS_TIMEOUT_SECONDS: ${BROWSERLESS_TIMEOUT_SECONDS:-30}
      WEB_EXTRACT_PLAYWRIGHT_TIMEOUT_SECONDS: ${WEB_EXTRACT_PLAYWRIGHT_TIMEOUT_SECONDS:-30}
      WEB_EXTRACT_PLAYWRIGHT_WAIT_UNTIL: ${WEB_EXTRACT_PLAYWRIGHT_WAIT_UNTIL:-domcontentloaded}
      WEB_EXTRACT_REVIEW_EVIDENCE_MAX_BYTES: ${WEB_EXTRACT_REVIEW_EVIDENCE_MAX_BYTES:-4096}
      SECRET_VAULT_DIR: /app/.synarch/secrets
      SECRET_VAULT_KEY: ${SECRET_VAULT_KEY:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - synarch_secrets:/app/.synarch/secrets
    depends_on:
      - control-plane
      - state-service
      - memory-service
      - event-service
      - agent-runtime

  scheduler-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/gateway
    command: python -m synarch_gateway.scheduler_worker --loop
    environment:
      GATEWAY_URL: http://gateway:8000
      STATE_SERVICE_URL: http://state-service:8020
      SYNARCH_SCHEDULER_WORKER_ID: ${SYNARCH_SCHEDULER_WORKER_ID:-scheduler-worker-1}
      SYNARCH_SCHEDULER_MAX_TASKS: ${SYNARCH_SCHEDULER_MAX_TASKS:-3}
      SYNARCH_SCHEDULER_INTERVAL_SECONDS: ${SYNARCH_SCHEDULER_INTERVAL_SECONDS:-30}
      SYNARCH_SCHEDULER_TIMEOUT_SECONDS: ${SYNARCH_SCHEDULER_TIMEOUT_SECONDS:-180}
    depends_on:
      - gateway
      - state-service

  connector-job-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/gateway
    command: python -m synarch_gateway.connector_job_worker --loop
    environment:
      GATEWAY_URL: http://gateway:8000
      STATE_SERVICE_URL: http://state-service:8020
      SYNARCH_CONNECTOR_JOB_WORKER_ID: ${SYNARCH_CONNECTOR_JOB_WORKER_ID:-connector-job-worker-1}
      SYNARCH_CONNECTOR_JOB_MAX_JOBS: ${SYNARCH_CONNECTOR_JOB_MAX_JOBS:-3}
      SYNARCH_CONNECTOR_JOB_KIND: ${SYNARCH_CONNECTOR_JOB_KIND:-cron}
      SYNARCH_CONNECTOR_JOB_INTERVAL_SECONDS: ${SYNARCH_CONNECTOR_JOB_INTERVAL_SECONDS:-30}
      SYNARCH_CONNECTOR_JOB_TIMEOUT_SECONDS: ${SYNARCH_CONNECTOR_JOB_TIMEOUT_SECONDS:-180}
      SYNARCH_CONNECTOR_JOB_PROJECT_ID: ${SYNARCH_CONNECTOR_JOB_PROJECT_ID:-}
      SYNARCH_CONNECTOR_JOB_SERVICE_ID: ${SYNARCH_CONNECTOR_JOB_SERVICE_ID:-}
      SYNARCH_CONNECTOR_JOB_OWNER_AGENT_ID: ${SYNARCH_CONNECTOR_JOB_OWNER_AGENT_ID:-}
    depends_on:
      - gateway
      - state-service

  memory-compaction-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/gateway
    command: python -m synarch_gateway.memory_compaction_worker --loop
    environment:
      GATEWAY_URL: http://gateway:8000
      STATE_SERVICE_URL: http://state-service:8020
      SYNARCH_MEMORY_COMPACTION_WORKER_ID: ${SYNARCH_MEMORY_COMPACTION_WORKER_ID:-memory-compaction-worker-1}
      SYNARCH_MEMORY_COMPACTION_SCOPE: ${SYNARCH_MEMORY_COMPACTION_SCOPE:-}
      SYNARCH_MEMORY_COMPACTION_PROJECT_ID: ${SYNARCH_MEMORY_COMPACTION_PROJECT_ID:-}
      SYNARCH_MEMORY_COMPACTION_AGENT_ID: ${SYNARCH_MEMORY_COMPACTION_AGENT_ID:-}
      SYNARCH_MEMORY_COMPACTION_MIN_SOURCE_TOKENS: ${SYNARCH_MEMORY_COMPACTION_MIN_SOURCE_TOKENS:-1200}
      SYNARCH_MEMORY_COMPACTION_MAX_SCOPES: ${SYNARCH_MEMORY_COMPACTION_MAX_SCOPES:-20}
      SYNARCH_MEMORY_COMPACTION_MAX_SOURCE_ITEMS: ${SYNARCH_MEMORY_COMPACTION_MAX_SOURCE_ITEMS:-20}
      SYNARCH_MEMORY_COMPACTION_MAX_SUMMARY_CHARS: ${SYNARCH_MEMORY_COMPACTION_MAX_SUMMARY_CHARS:-1200}
      SYNARCH_MEMORY_COMPACTION_INTERVAL_SECONDS: ${SYNARCH_MEMORY_COMPACTION_INTERVAL_SECONDS:-300}
      SYNARCH_MEMORY_COMPACTION_TIMEOUT_SECONDS: ${SYNARCH_MEMORY_COMPACTION_TIMEOUT_SECONDS:-60}
    depends_on:
      - gateway
      - state-service

  memory-embedding-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/gateway
    command: python -m synarch_gateway.memory_embedding_worker --loop
    environment:
      GATEWAY_URL: http://gateway:8000
      STATE_SERVICE_URL: http://state-service:8020
      SYNARCH_MEMORY_EMBEDDING_WORKER_ID: ${SYNARCH_MEMORY_EMBEDDING_WORKER_ID:-memory-embedding-worker-1}
      SYNARCH_MEMORY_EMBEDDING_PROJECT_ID: ${SYNARCH_MEMORY_EMBEDDING_PROJECT_ID:-}
      SYNARCH_MEMORY_EMBEDDING_AGENT_ID: ${SYNARCH_MEMORY_EMBEDDING_AGENT_ID:-}
      SYNARCH_MEMORY_EMBEDDING_SCOPE: ${SYNARCH_MEMORY_EMBEDDING_SCOPE:-}
      SYNARCH_MEMORY_EMBEDDING_STATUS: ${SYNARCH_MEMORY_EMBEDDING_STATUS:-approved}
      SYNARCH_MEMORY_EMBEDDING_MAX_ITEMS: ${SYNARCH_MEMORY_EMBEDDING_MAX_ITEMS:-10}
      SYNARCH_MEMORY_EMBEDDING_INTERVAL_SECONDS: ${SYNARCH_MEMORY_EMBEDDING_INTERVAL_SECONDS:-300}
      SYNARCH_MEMORY_EMBEDDING_TIMEOUT_SECONDS: ${SYNARCH_MEMORY_EMBEDDING_TIMEOUT_SECONDS:-60}
    depends_on:
      - gateway
      - state-service

  work-queue-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/state-service
    command: python -m synarch_state_service.work_queue_worker --loop
    environment:
      STATE_SERVICE_URL: http://state-service:8020
      SYNARCH_WORK_QUEUE_WORKER_ID: ${SYNARCH_WORK_QUEUE_WORKER_ID:-work-queue-worker-1}
      SYNARCH_WORK_QUEUE_NAME: ${SYNARCH_WORK_QUEUE_NAME:-default}
      SYNARCH_WORK_QUEUE_MAX_ITEMS: ${SYNARCH_WORK_QUEUE_MAX_ITEMS:-5}
      SYNARCH_WORK_QUEUE_LEASE_SECONDS: ${SYNARCH_WORK_QUEUE_LEASE_SECONDS:-300}
      SYNARCH_WORK_QUEUE_INTERVAL_SECONDS: ${SYNARCH_WORK_QUEUE_INTERVAL_SECONDS:-30}
      SYNARCH_WORK_QUEUE_TIMEOUT_SECONDS: ${SYNARCH_WORK_QUEUE_TIMEOUT_SECONDS:-30}
    depends_on:
      state-service:
        condition: service_healthy

  control-plane:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/control-plane
    environment:
      APP_MODULE: synarch_control_plane.main:app
      PORT: 8010
      STATE_SERVICE_URL: http://state-service:8020
      DATABASE_URL: postgresql+psycopg://synarch:synarch@postgres:5432/synarch
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      state-service:
        condition: service_healthy

  state-migrations:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/state-service
    command: >
      sh -c "python -m synarch_state_service.migrations
      && python -m synarch_state_service.seeds"
    environment:
      DATABASE_URL: postgresql+psycopg://synarch:synarch@postgres:5432/synarch
    depends_on:
      postgres:
        condition: service_healthy

  state-service:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/state-service
    environment:
      APP_MODULE: synarch_state_service.main:app
      PORT: 8020
      DATABASE_URL: postgresql+psycopg://synarch:synarch@postgres:5432/synarch
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      TASK_RETRY_BACKOFF_SECONDS: ${TASK_RETRY_BACKOFF_SECONDS:-60}
    ports:
      - "8020:8020"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/healthz', timeout=2)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      state-migrations:
        condition: service_completed_successfully

  memory-service:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/memory-service
    environment:
      APP_MODULE: synarch_memory_service.main:app
      PORT: 8030
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://synarch:synarch@postgres:5432/synarch
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  event-service:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/event-service
    environment:
      APP_MODULE: synarch_event_service.main:app
      PORT: 8040
      NATS_URL: nats://nats:4222
    ports:
      - "8040:8040"
    depends_on:
      nats:
        condition: service_started

  model-gateway:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/model-gateway
    environment:
      APP_MODULE: synarch_model_gateway.main:app
      PORT: 8060
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-fake}
      STATE_SERVICE_URL: http://state-service:8020
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_ID: ${OPENROUTER_MODEL_ID:-deepseek/deepseek-v4-flash}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-1800}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-180}
      OPENROUTER_REASONING_ENABLED: ${OPENROUTER_REASONING_ENABLED:-false}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-none}
      OPENROUTER_REASONING_EXCLUDE: ${OPENROUTER_REASONING_EXCLUDE:-true}
      OPENROUTER_INPUT_COST_PER_MILLION_TOKENS: ${OPENROUTER_INPUT_COST_PER_MILLION_TOKENS:-0}
      OPENROUTER_OUTPUT_COST_PER_MILLION_TOKENS: ${OPENROUTER_OUTPUT_COST_PER_MILLION_TOKENS:-0}
    ports:
      - "8060:8060"
    depends_on:
      state-service:
        condition: service_healthy

  agent-runtime:
    build:
      context: .
      dockerfile: packages/Dockerfile.service
      args:
        SERVICE_PATH: packages/agent-runtime
    environment:
      APP_MODULE: synarch_agent_runtime.main:app
      PORT: 8050
      MEMORY_SERVICE_URL: http://memory-service:8030
      EVENT_SERVICE_URL: http://event-service:8040
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-stub}
      MODEL_GATEWAY_URL: http://model-gateway:8060
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-180}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_ID: ${OPENROUTER_MODEL_ID:-deepseek/deepseek-v4-flash}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-1800}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-180}
      OPENROUTER_REASONING_ENABLED: ${OPENROUTER_REASONING_ENABLED:-false}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-none}
      OPENROUTER_REASONING_EXCLUDE: ${OPENROUTER_REASONING_EXCLUDE:-true}
      OPENROUTER_INPUT_COST_PER_MILLION_TOKENS: ${OPENROUTER_INPUT_COST_PER_MILLION_TOKENS:-0}
      OPENROUTER_OUTPUT_COST_PER_MILLION_TOKENS: ${OPENROUTER_OUTPUT_COST_PER_MILLION_TOKENS:-0}
    ports:
      - "8050:8050"
    depends_on:
      - memory-service
      - event-service
      - model-gateway

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
  synarch_secrets:
